<!-- Godot IPC Bridge -->
<script>
(function() {
    var selectedPlanet = null;

    // Signal ready to Godot
    if (window.sendIpcData) {
        window.sendIpcData({ action: 'ready', data: { screen: 'select-target' } });
    }

    // Wire up back button
    var backBtn = document.getElementById('back-btn');
    if (backBtn) {
        backBtn.addEventListener('click', function() {
            if (window.sendIpcData) {
                window.sendIpcData({ action: 'menu-select', data: { item: 'back' } });
            }
        });
    }

    // Wire up planet card clicks with visual selection feedback
    document.querySelectorAll('[data-planet]').forEach(function(el) {
        el.addEventListener('click', function() {
            selectedPlanet = el.getAttribute('data-planet');

            // Visual feedback: highlight selected card
            document.querySelectorAll('[data-planet]').forEach(function(card) {
                card.style.outline = 'none';
            });
            el.style.outline = '2px solid rgba(125, 211, 252, 0.8)';
            el.style.outlineOffset = '4px';

            if (window.sendIpcData) {
                window.sendIpcData({ action: 'planet-selected', data: { planet: selectedPlanet } });
            }
        });
    });

    // Wire up action buttons — require planet selection first
    document.querySelectorAll('.hologram-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            if (!selectedPlanet) {
                // Flash a hint if no planet selected
                var cards = document.querySelectorAll('[data-planet]');
                cards.forEach(function(c) { c.style.outline = '1px solid rgba(255,180,171,0.5)'; });
                setTimeout(function() {
                    cards.forEach(function(c) { c.style.outline = 'none'; });
                }, 600);
                return;
            }

            var label = btn.querySelector('span:last-of-type');
            var action = label ? label.textContent.trim().toLowerCase().replace(/\s+/g, '-') : 'unknown';
            if (window.sendIpcData) {
                window.sendIpcData({ action: 'button-clicked', data: { button: action } });
            }
        });
    });
})();
</script>
