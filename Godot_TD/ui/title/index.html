<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Grid Background Effect */
        .moving-grid {
            background-image: 
                linear-gradient(to right, rgba(129, 236, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(129, 236, 255, 0.1) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { background-position: 0 0; }
            100% { background-position: 800px 0; }
        }

        /* Scanline Texture */
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Fade-in Entrance */
        .entrance-fade {
            animation: entrance-anim 4.5s ease-out forwards;
        }

        @keyframes entrance-anim {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Metallic Shine Effect */
        .text-shine {
            position: relative;
            overflow: hidden;
        }
        .text-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(129, 236, 255, 0.4), transparent);
            animation: shine 6s infinite ease-in-out;
        }

        @keyframes shine {
            0%, 70% { left: -100%; }
            85% { left: 150%; }
            100% { left: 150%; }
        }

        .asymmetric-panel {
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
        }
    </style>

<!-- Godot IPC Bridge -->
<script>
(function() {
    if (window.sendIpcData) {
        window.sendIpcData({ action: 'ready', data: { screen: 'title' } });
    }

    var buttonMap = {
        'NEW GAME': 'new-game',
        'CONTINUE': 'continue',
        'LOAD GAME': 'load-game',
        'SETTINGS': 'settings',
        'EXIT_TERMINAL': 'exit'
    };

    document.querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var label = btn.querySelector('span');
            var text = label ? label.textContent.trim() : '';
            var action = buttonMap[text] || 'unknown';

            if (window.sendIpcData) {
                window.sendIpcData({ action: 'menu-select', data: { item: action } });
            }
        });
    });
})();
</script>
