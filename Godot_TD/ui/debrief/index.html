<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DEBRIEF</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#c5eaff",
        "background": "#0b1326",
        "surface": "#0b1326",
        "surface-container": "#171f33",
        "surface-container-low": "#131b2e",
        "surface-container-lowest": "#060e20",
        "surface-container-high": "#222a3d",
        "surface-variant": "#2d3449",
        "on-surface": "#dae2fd",
        "on-surface-variant": "#bec8ce",
        "secondary": "#bec6e0",
        "tertiary": "#65fce6",
        "tertiary-dim": "#3cddc7",
        "error": "#ffb4ab",
        "outline": "#899298",
        "outline-variant": "#3f484e",
        "primary-container": "#7dd3fc",
        "primary-dim": "#7bd1fa",
        "victory-green": "#4ade80",
        "defeat-amber": "#fbbf24"
      },
      fontFamily: {
        "headline": ["Space Grotesk"],
        "body": ["Space Grotesk"],
        "label": ["Space Grotesk"]
      },
      borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
    },
  },
}
</script>
<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  display: inline-block;
  line-height: 1;
}
.glass-panel {
  background: linear-gradient(135deg, rgba(125, 211, 252, 0.05) 0%, rgba(23, 31, 51, 0.4) 100%);
  backdrop-filter: blur(12px);
}
.scanline {
  background: linear-gradient(to bottom, transparent 50%, rgba(125, 211, 252, 0.05) 50%);
  background-size: 100% 4px;
}
.hologram-btn {
  background: linear-gradient(90deg, transparent 0%, rgba(125, 211, 252, 0.1) 50%, transparent 100%);
  border: 1px solid rgba(125, 211, 252, 0.3);
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.hologram-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.4), transparent);
  transition: 0.5s;
}
.hologram-btn:hover::before {
  left: 100%;
}
.hologram-btn:hover {
  border-color: rgba(125, 211, 252, 0.8);
  box-shadow: 0 0 20px rgba(125, 211, 252, 0.2);
  transform: translateY(-2px);
}
@keyframes count-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.hero-stat {
  animation: count-pulse 2s ease-in-out 1;
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fade-up 0.6s ease-out forwards; }
.fade-up-d1 { animation: fade-up 0.6s ease-out 0.2s forwards; opacity: 0; }
.fade-up-d2 { animation: fade-up 0.6s ease-out 0.4s forwards; opacity: 0; }
.fade-up-d3 { animation: fade-up 0.6s ease-out 0.6s forwards; opacity: 0; }
.fade-up-d4 { animation: fade-up 0.6s ease-out 0.8s forwards; opacity: 0; }
.fade-up-d5 { animation: fade-up 0.6s ease-out 1.0s forwards; opacity: 0; }

/* Suit capture panel */
#suit-capture { display: none; }
#suit-capture.visible { display: block; }
</style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body selection:bg-primary/30 overflow-hidden h-screen w-screen cursor-crosshair select-none">
<!-- Background -->
<div class="fixed inset-0 z-0 bg-surface-container-lowest overflow-hidden">
  <div class="absolute inset-0 opacity-40 scanline"></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary-container/5 via-surface-container-lowest to-surface-container-lowest"></div>
</div>

<!-- Main Content -->
<main class="relative z-10 w-full h-full flex flex-col items-center justify-center overflow-hidden px-6">

  <!-- Title -->
  <h1 id="debrief-title" class="font-black text-5xl tracking-tighter mb-2 fade-up text-victory-green">
    EXTRACTION COMPLETE
  </h1>

  <!-- Flavor text -->
  <p id="flavor-text" class="text-sm text-secondary/50 tracking-wider mb-8 fade-up-d1">How far did you push it?</p>

  <!-- Hero extraction count -->
  <div class="flex flex-col items-center mb-4 fade-up-d1">
    <span id="extraction-count" class="hero-stat font-black text-8xl tracking-tighter text-victory-green">
      0
    </span>
    <span class="text-xs text-secondary/40 uppercase tracking-[0.3em] mt-1">Resources Extracted</span>
  </div>

  <!-- Meta resource transfer -->
  <div class="flex items-center gap-2 mb-10 fade-up-d2">
    <span class="material-symbols-outlined text-lg text-amber-400">arrow_forward</span>
    <span class="text-lg font-bold text-amber-400">+<span id="meta-gained">0</span></span>
    <span class="text-sm text-amber-400/60">Meta Resources</span>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-4 gap-4 max-w-[600px] w-full mb-8 fade-up-d3">
    <div class="glass-panel border border-sky-400/10 p-4 flex flex-col items-center">
      <span class="text-[9px] uppercase tracking-widest text-secondary/40 mb-1">Deepest Wave</span>
      <span id="stat-wave" class="font-black text-2xl text-sky-300">0</span>
    </div>
    <div class="glass-panel border border-sky-400/10 p-4 flex flex-col items-center">
      <span class="text-[9px] uppercase tracking-widest text-secondary/40 mb-1">Core Lives</span>
      <span id="stat-lives" class="font-black text-2xl text-sky-300">0</span>
    </div>
    <div class="glass-panel border border-sky-400/10 p-4 flex flex-col items-center">
      <span class="text-[9px] uppercase tracking-widest text-secondary/40 mb-1">Run Mode</span>
      <span id="stat-mode" class="font-black text-lg text-sky-300">Harvest</span>
    </div>
    <div class="glass-panel border border-sky-400/10 p-4 flex flex-col items-center">
      <span class="text-[9px] uppercase tracking-widest text-secondary/40 mb-1">Planet</span>
      <span id="stat-planet" class="font-black text-lg text-sky-300">P1</span>
    </div>
  </div>

  <!-- Suit Capture Panel (farming runs only) -->
  <div id="suit-capture" class="glass-panel border border-tertiary/20 p-5 max-w-[420px] w-full mb-6 fade-up-d4">
    <div class="flex items-center gap-3 mb-3">
      <span class="material-symbols-outlined text-2xl text-tertiary">checkroom</span>
      <div>
        <span class="font-bold text-sm text-tertiary uppercase tracking-wider">Save This Build As A Suit?</span>
        <p class="text-[10px] text-secondary/40">Suits are used in boss runs. <span id="suit-slots-info">0 slots available</span></p>
      </div>
    </div>
    <div class="flex gap-3 items-center">
      <input id="suit-name-input" type="text" placeholder="Name your suit..." class="flex-1 bg-surface-container-lowest border border-sky-400/20 px-3 py-2 text-sm text-on-surface placeholder:text-outline/40 focus:border-tertiary/50 focus:outline-none"/>
      <button id="save-suit-btn" class="hologram-btn px-4 py-2 text-sm font-bold text-tertiary uppercase tracking-wider" style="border-color: rgba(101,252,230,0.4);">Save</button>
      <button id="skip-suit-btn" class="px-4 py-2 text-sm font-bold text-secondary/40 uppercase tracking-wider hover:text-secondary/70 transition-colors">Skip</button>
    </div>
    <div id="suit-save-result" class="hidden mt-2 text-sm font-bold text-center"></div>
  </div>

  <!-- Continue Button -->
  <div class="fade-up-d5">
    <button id="continue-btn" class="hologram-btn px-10 py-4 flex items-center gap-3 group">
      <div class="absolute inset-y-0 left-0 w-1 bg-sky-400 shadow-[0_0_15px_rgba(125,211,252,0.8)]"></div>
      <span class="material-symbols-outlined text-sky-300 group-hover:text-white transition-colors">arrow_forward</span>
      <span class="font-black text-sky-300 tracking-[0.2em] uppercase text-lg group-hover:text-white transition-colors">Continue to Hub</span>
      <div class="absolute inset-y-0 right-0 w-1 bg-sky-400/30"></div>
    </button>
  </div>
</main>

<!-- Corner Decorations -->
<div class="fixed top-0 left-0 w-32 h-32 pointer-events-none z-[60] border-t-4 border-l-4 border-sky-400/20 m-2"></div>
<div class="fixed top-0 right-0 w-32 h-32 pointer-events-none z-[60] border-t-4 border-r-4 border-sky-400/20 m-2"></div>
<div class="fixed bottom-0 left-0 w-32 h-32 pointer-events-none z-[60] border-b-4 border-l-4 border-sky-400/20 m-2"></div>
<div class="fixed bottom-0 right-0 w-32 h-32 pointer-events-none z-[60] border-b-4 border-r-4 border-sky-400/20 m-2"></div>
<!-- HUD Vignette -->
<div class="fixed inset-0 pointer-events-none z-[55] shadow-[inset_0_0_150px_rgba(6,14,32,0.8)]"></div>

<!-- Godot IPC Bridge -->
<script>
(function() {
    if (window.sendIpcData) {
        window.sendIpcData({ action: 'ready', data: { screen: 'debrief' } });
    }

    // Continue button
    document.getElementById('continue-btn').addEventListener('click', function() {
        if (window.sendIpcData) {
            window.sendIpcData({ action: 'continue-to-hub', data: {} });
        }
    });

    // Save suit button
    document.getElementById('save-suit-btn').addEventListener('click', function() {
        var name = document.getElementById('suit-name-input').value.trim();
        if (!name) name = 'Unnamed Suit';
        if (window.sendIpcData) {
            window.sendIpcData({ action: 'save-suit', data: { name: name } });
        }
    });

    // Skip suit button
    document.getElementById('skip-suit-btn').addEventListener('click', function() {
        if (window.sendIpcData) {
            window.sendIpcData({ action: 'skip-suit', data: {} });
        }
        document.getElementById('suit-capture').classList.remove('visible');
    });

    // Animated counter
    function animateCounter(elementId, target, duration) {
        var el = document.getElementById(elementId);
        if (!el) return;
        var start = 0;
        var startTime = null;

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            var progress = Math.min((timestamp - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
            el.textContent = Math.floor(eased * target);
            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                el.textContent = target;
            }
        }
        requestAnimationFrame(step);
    }

    // Rendering API
    window.__debriefUI = {
        init: function(isVictory, totalExtracted, metaResourcesGained, deepestWave, coreLives, runMode, planetName) {
            var titleEl = document.getElementById('debrief-title');
            if (isVictory) {
                titleEl.textContent = 'EXTRACTION COMPLETE';
                titleEl.className = titleEl.className.replace(/text-\S+/g, '') + ' text-victory-green';
            } else {
                titleEl.textContent = 'EXTRACTION TERMINATED';
                titleEl.className = titleEl.className.replace(/text-\S+/g, '') + ' text-defeat-amber';
            }

            // Hero stat
            var countEl = document.getElementById('extraction-count');
            countEl.className = countEl.className.replace(/text-\S+/g, '') + (isVictory ? ' text-victory-green' : ' text-defeat-amber');
            animateCounter('extraction-count', totalExtracted, 1500);

            document.getElementById('meta-gained').textContent = metaResourcesGained;
            document.getElementById('stat-wave').textContent = deepestWave;
            document.getElementById('stat-lives').textContent = coreLives;
            document.getElementById('stat-mode').textContent = runMode;
            document.getElementById('stat-planet').textContent = planetName;
        },

        showSuitPrompt: function(availableSlots, suggestedName) {
            document.getElementById('suit-capture').classList.add('visible');
            document.getElementById('suit-slots-info').textContent = availableSlots + ' slot' + (availableSlots !== 1 ? 's' : '') + ' available';
            document.getElementById('suit-name-input').value = suggestedName || '';
        },

        showConquest: function(siteName, conqueredRegion) {
            // Insert territory conquest banner after the extraction stats
            var banner = document.createElement('div');
            banner.className = 'mt-6 p-4 border border-tertiary/30 bg-tertiary/5 text-center';
            banner.innerHTML = '<div class="flex items-center justify-center gap-2 mb-2">' +
                '<span class="material-symbols-outlined text-tertiary text-lg">verified</span>' +
                '<span class="text-xs font-bold text-tertiary tracking-widest uppercase">SITE SECURED</span>' +
                '</div>' +
                '<p class="text-sm font-bold text-on-surface">' + siteName + '</p>';
            if (conqueredRegion) {
                banner.innerHTML += '<div class="mt-3 pt-3 border-t border-tertiary/20">' +
                    '<div class="flex items-center justify-center gap-2">' +
                    '<span class="material-symbols-outlined text-tertiary text-xl" style="font-variation-settings:\'FILL\' 1">auto_awesome</span>' +
                    '<span class="text-sm font-black text-tertiary tracking-widest uppercase">REGION CONQUERED: ' + conqueredRegion + '</span>' +
                    '</div>' +
                    '<p class="text-xs text-tertiary/60 mt-1">Conquest buff activated!</p>' +
                    '</div>';
            }
            // Insert after the stats grid
            var statsGrid = document.querySelector('.grid');
            if (statsGrid) statsGrid.parentNode.insertBefore(banner, statsGrid.nextSibling);
        },

        setSuitSaveResult: function(success, slotIndex) {
            var el = document.getElementById('suit-save-result');
            el.classList.remove('hidden');
            if (success) {
                el.textContent = 'Suit saved to slot ' + (slotIndex + 1) + '!';
                el.className = 'mt-2 text-sm font-bold text-center text-tertiary';
                // Hide input area
                document.getElementById('save-suit-btn').style.display = 'none';
                document.getElementById('skip-suit-btn').style.display = 'none';
                document.getElementById('suit-name-input').style.display = 'none';
            } else {
                el.textContent = 'No empty slots available.';
                el.className = 'mt-2 text-sm font-bold text-center text-error';
            }
        }
    };
})();
</script>
</body></html>
