<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Relic Inventory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface": "#0b1326", "surface-container": "#171f33", "surface-container-high": "#222a3e",
        "surface-container-highest": "#2d3449", "surface-container-lowest": "#060d20",
        "on-surface": "#dbe2fd", "on-surface-variant": "#c1c7cc",
        "primary-container": "#c3e8fd", "primary-fixed-dim": "#a7cce0",
        "secondary": "#bec6e0", "tertiary-container": "#62fae4", "tertiary-fixed-dim": "#3cddc8",
        "error": "#ffb4ab", "outline-variant": "#41484b",
      },
      fontFamily: { "headline": ["Space Grotesk"], "body": ["Space Grotesk"] },
      borderRadius: { "DEFAULT": "0", "lg": "0", "xl": "0", "full": "9999px" },
    },
  },
}
</script>
<style>
body { font-family: 'Space Grotesk', sans-serif; background: #0b1326; margin: 0; overflow: hidden; color: #dbe2fd; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; font-size: 18px; }
.scanlines { background: linear-gradient(to bottom, rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px; pointer-events: none; }
.relic-card { transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
.relic-card:hover { transform: translateY(-2px); }
.relic-card.selected { box-shadow: 0 0 22px rgba(197,234,255,0.25); border-color: rgba(197,234,255,0.6) !important; }
.relic-card.locked { opacity: 0.4; }
.slot { min-height: 92px; }
.rarity-rare { color: #c3e8fd; }
.rarity-legendary { color: #ffcf7a; }
</style>
</head>
<body class="h-screen w-screen overflow-hidden">
<div class="fixed inset-0 scanlines z-50 opacity-30 pointer-events-none"></div>

<header class="fixed top-0 w-full z-30 flex justify-between items-center px-8 h-14 bg-surface/80 backdrop-blur-md border-b border-primary-container/10">
  <div class="flex items-center gap-4">
    <button onclick="sendAction('menu-select',{item:'back'})" class="material-symbols-outlined text-secondary/60 hover:text-primary-container transition-colors p-2">arrow_back</button>
    <h1 class="text-lg font-black text-primary-container tracking-tighter font-headline uppercase">RELICS</h1>
    <span class="text-xs text-secondary/50 tracking-wide">Each relic changes how something fights, for the run it's found in.</span>
  </div>
  <span id="count-label" class="text-xs text-secondary/60 tracking-widest uppercase">0 / 0</span>
</header>

<main class="flex h-screen pt-14">
  <div class="flex-1 overflow-y-auto p-6">
    <!-- How relics work (they come from a run's crates and come off when it ends) -->
    <div id="run-note" class="p-4 mb-6 bg-surface-container-high/60 border border-outline-variant/30 text-sm text-on-surface-variant leading-relaxed"></div>
    <!-- Every relic, by kind -->
    <div id="relic-groups" class="flex flex-col gap-5"></div>
  </div>

  <aside id="detail-panel" class="w-96 bg-surface-container/90 backdrop-blur-xl border-l border-outline-variant/10 flex flex-col overflow-hidden">
    <div class="flex-1 p-6 flex flex-col">
      <div id="detail-empty" class="flex-1 flex items-center justify-center">
        <p class="text-sm text-secondary/30 tracking-widest uppercase">Select a relic</p>
      </div>
      <div id="detail-content" class="hidden flex-1 flex flex-col">
        <div class="flex items-center gap-3 mb-1">
          <span id="detail-icon" class="material-symbols-outlined text-3xl"></span>
          <div>
            <h2 id="detail-name" class="text-xl font-black font-headline uppercase tracking-tight"></h2>
            <span id="detail-meta" class="text-[11px] font-bold tracking-widest uppercase text-secondary/60"></span>
          </div>
        </div>
        <p id="detail-desc" class="text-sm text-on-surface-variant leading-relaxed mt-4 mb-4"></p>
        <div id="detail-tradeoff-section" class="hidden mb-4 p-3 border-l-2 border-error/40 bg-error/5">
          <span class="text-[10px] text-error/70 tracking-widest uppercase block mb-1">TRADE-OFF</span>
          <p id="detail-tradeoff" class="text-sm text-error/90"></p>
        </div>
        <p id="detail-slot" class="text-xs text-secondary/60 mb-4"></p>
        <div class="mt-auto" id="detail-actions"></div>
      </div>
    </div>
  </aside>
</main>

<script>
function sendAction(action, data) {
  if (window.sendIpcData) window.sendIpcData({ action, data: data || {} });
}
var KIND_NAMES = { bit: "BIT's weapon", towers: "Towers", spire: "The Spire" };
var KIND_ICONS = { bit: "smart_toy", towers: "cell_tower", spire: "change_history" };

window.__relicUI = {
  setCount(owned, total) {
    document.getElementById('count-label').textContent = owned + ' / ' + total + ' FOUND';
  },
  setEquipCount(equipped, max) {},

  clearGrid() {
    document.getElementById('relic-groups').innerHTML = '';
  },

  setNote(text) {
    document.getElementById('run-note').textContent = text;
  },

  addRelic(id, name, icon, rarity, desc, hasTradeoff, locked, equipped, kind, color) {
    kind = kind || 'bit';
    var group = document.getElementById('group-' + kind);
    if (!group) {
      var wrap = document.createElement('section');
      wrap.innerHTML = '<h3 class="text-xs font-bold tracking-widest uppercase text-secondary/60 mb-2">' + KIND_NAMES[kind] + '</h3>' +
        '<div id="group-' + kind + '" class="grid grid-cols-3 gap-3"></div>';
      document.getElementById('relic-groups').appendChild(wrap);
      group = document.getElementById('group-' + kind);
    }
    var card = document.createElement('div');
    card.className = 'relic-card p-3 bg-surface-container-high/60 border border-outline-variant/20 ' + (locked ? 'locked ' : '');
    if (equipped) card.style.borderColor = color;
    card.id = 'relic-' + id;
    card.onclick = function() {
      document.querySelectorAll('.relic-card').forEach(function(c) { c.classList.remove('selected'); });
      card.classList.add('selected');
      sendAction('relic-selected', { relic: id });
    };
    card.innerHTML =
      '<div class="flex items-center justify-between mb-1">' +
        '<span class="material-symbols-outlined text-xl" style="color:' + (locked ? '#55606f' : color) + '">' + (locked ? 'lock' : (icon || 'auto_awesome')) + '</span>' +
        (equipped ? '<span class="text-[9px] font-bold tracking-widest" style="color:' + color + '">EQUIPPED</span>' : '') +
      '</div>' +
      '<p class="text-sm font-bold uppercase tracking-wide" style="color:' + (locked ? '#8a93a3' : color) + '">' + name + '</p>' +
      '<p class="text-[10px] text-secondary/50 mt-0.5 uppercase tracking-widest rarity-' + rarity + '">' + rarity + (locked ? ' · not found yet' : '') + '</p>';
    group.appendChild(card);
  },

  showDetail(id, name, icon, rarity, desc, tradeoff, owned, equipped, kind, color, slotNote) {
    document.getElementById('detail-empty').classList.add('hidden');
    document.getElementById('detail-content').classList.remove('hidden');
    var iconEl = document.getElementById('detail-icon');
    iconEl.textContent = owned ? (icon || 'auto_awesome') : 'lock';
    iconEl.style.color = color;
    var nameEl = document.getElementById('detail-name');
    nameEl.textContent = name;
    nameEl.style.color = color;
    document.getElementById('detail-meta').textContent = (KIND_NAMES[kind] || '') + ' · ' + rarity;
    document.getElementById('detail-desc').textContent = desc;
    var t = document.getElementById('detail-tradeoff-section');
    if (tradeoff) { t.classList.remove('hidden'); document.getElementById('detail-tradeoff').textContent = tradeoff; }
    else t.classList.add('hidden');
    document.getElementById('detail-slot').textContent = slotNote || '';
    var actions = document.getElementById('detail-actions');
    actions.innerHTML = owned ? ''
      : '<div class="text-center py-3 text-secondary/40 text-xs tracking-widest uppercase">Not found yet: relics come out of loot crates</div>';
    document.querySelectorAll('.relic-card').forEach(function(c) { c.classList.remove('selected'); });
    var g = document.getElementById('relic-' + id);
    if (g) g.classList.add('selected');
  }
};

sendAction('ready');
</script>
</body></html>
