<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Relic Inventory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface": "#0b1326", "surface-container": "#171f33", "surface-container-high": "#222a3e",
        "surface-container-highest": "#2d3449", "surface-container-lowest": "#060d20",
        "on-surface": "#dbe2fd", "on-surface-variant": "#c1c7cc",
        "primary-container": "#c3e8fd", "primary-fixed-dim": "#a7cce0",
        "secondary": "#bec6e0", "tertiary-container": "#62fae4", "tertiary-fixed-dim": "#3cddc8",
        "error": "#ffb4ab", "outline-variant": "#41484b",
      },
      fontFamily: { "headline": ["Space Grotesk"], "body": ["Space Grotesk"] },
      borderRadius: { "DEFAULT": "0", "lg": "0", "xl": "0", "full": "9999px" },
    },
  },
}
</script>
<style>
body { font-family: 'Space Grotesk', sans-serif; background: #0b1326; margin: 0; overflow: hidden; color: #dbe2fd; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; font-size: 18px; }
.scanlines { background: linear-gradient(to bottom, rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px; pointer-events: none; }
.relic-card { transition: all 0.2s; cursor: pointer; }
.relic-card:hover { transform: translateY(-2px); }
.relic-card.selected { box-shadow: 0 0 20px rgba(197,234,255,0.3); border-color: rgba(197,234,255,0.6) !important; }
.relic-card.locked { opacity: 0.35; pointer-events: none; }
.relic-card.equipped { border-color: rgba(60,221,200,0.5) !important; }
.rarity-common { color: #bec6e0; }
.rarity-uncommon { color: #62fae4; }
.rarity-rare { color: #c3e8fd; }
.rarity-legendary { color: #ffb4ab; }
.rarity-mythic { color: #d946ef; }
</style>
</head>
<body class="h-screen w-screen overflow-hidden">
<div class="fixed inset-0 scanlines z-50 opacity-30 pointer-events-none"></div>

<!-- Header -->
<header class="fixed top-0 w-full z-30 flex justify-between items-center px-8 h-14 bg-surface/80 backdrop-blur-md border-b border-primary-container/10">
  <div class="flex items-center gap-4">
    <button onclick="sendAction('menu-select',{item:'back'})" class="material-symbols-outlined text-secondary/60 hover:text-primary-container transition-colors p-2">arrow_back</button>
    <h1 class="text-lg font-black text-primary-container tracking-tighter font-headline uppercase">RELIC VAULT</h1>
  </div>
  <div class="flex items-center gap-4">
    <span id="count-label" class="text-xs text-secondary/60 tracking-widest uppercase">0 / 0</span>
    <span id="equip-label" class="text-xs text-tertiary-fixed-dim tracking-widest uppercase">[0/3 EQUIPPED]</span>
  </div>
</header>

<!-- Main: grid left, detail right -->
<main class="flex h-screen pt-14">
  <!-- Grid -->
  <div class="flex-1 overflow-y-auto p-6">
    <div id="relic-grid" class="grid grid-cols-3 gap-3">
      <!-- Relic cards injected here -->
    </div>
  </div>

  <!-- Detail panel -->
  <aside id="detail-panel" class="w-80 bg-surface-container/90 backdrop-blur-xl border-l border-outline-variant/10 flex flex-col overflow-hidden">
    <div class="flex-1 p-6 flex flex-col">
      <div id="detail-empty" class="flex-1 flex items-center justify-center">
        <p class="text-sm text-secondary/30 tracking-widest uppercase">Select a relic</p>
      </div>
      <div id="detail-content" class="hidden flex-1 flex flex-col">
        <div class="flex items-center gap-3 mb-4">
          <span id="detail-icon" class="material-symbols-outlined text-3xl text-primary-container"></span>
          <div>
            <h2 id="detail-name" class="text-lg font-black text-on-surface font-headline uppercase tracking-tight"></h2>
            <span id="detail-rarity" class="text-[10px] font-bold tracking-widest uppercase"></span>
          </div>
        </div>
        <p id="detail-desc" class="text-xs text-on-surface-variant leading-relaxed mb-4"></p>
        <div id="detail-tradeoff-section" class="hidden mb-4 p-3 border-l-2 border-error/40 bg-error/5">
          <span class="text-[9px] text-error/60 tracking-widest uppercase block mb-1">TRADEOFF</span>
          <p id="detail-tradeoff" class="text-xs text-error/80"></p>
        </div>
        <div class="mt-auto" id="detail-actions"></div>
      </div>
    </div>
  </aside>
</main>

<script>
function sendAction(action, data) {
  if (window.sendIpcData) window.sendIpcData({ action, data: data || {} });
}

window.__relicUI = {
  setCount(owned, total) {
    document.getElementById('count-label').textContent = owned + ' / ' + total + ' COLLECTED';
  },

  setEquipCount(equipped, max) {
    document.getElementById('equip-label').textContent = '[' + equipped + '/' + max + ' EQUIPPED]';
  },

  clearGrid() {
    document.getElementById('relic-grid').innerHTML = '';
  },

  addRelic(id, name, icon, rarity, desc, hasTradeoff, locked, equipped) {
    var grid = document.getElementById('relic-grid');
    var card = document.createElement('div');
    var rarityClass = 'rarity-' + (rarity || 'common').toLowerCase();
    card.className = 'relic-card p-3 bg-surface-container-high/60 border border-outline-variant/20 ' +
      (locked ? 'locked ' : '') + (equipped ? 'equipped ' : '');
    card.id = 'relic-' + id;
    card.onclick = function() {
      document.querySelectorAll('.relic-card').forEach(function(c) { c.classList.remove('selected'); });
      card.classList.add('selected');
      sendAction('relic-selected', { relic: id });
    };

    card.innerHTML =
      '<div class="flex items-center gap-2 mb-1">' +
        '<span class="material-symbols-outlined text-lg ' + rarityClass + '">' + (locked ? 'lock' : (icon || 'auto_awesome')) + '</span>' +
        (equipped ? '<span class="text-[8px] text-tertiary-fixed-dim font-bold tracking-widest">EQUIPPED</span>' : '') +
      '</div>' +
      '<p class="text-xs font-bold ' + (locked ? 'text-secondary/30' : rarityClass) + ' uppercase tracking-wide">' +
        (locked ? '???' : name) +
      '</p>' +
      '<p class="text-[9px] text-secondary/40 mt-0.5 uppercase tracking-widest">' + (rarity || '') + '</p>';

    grid.appendChild(card);
  },

  showDetail(id, name, icon, rarity, desc, tradeoff, owned, equipped) {
    document.getElementById('detail-empty').classList.add('hidden');
    var content = document.getElementById('detail-content');
    content.classList.remove('hidden');

    var rarityClass = 'rarity-' + (rarity || 'common').toLowerCase();
    document.getElementById('detail-icon').textContent = icon || 'auto_awesome';
    document.getElementById('detail-icon').className = 'material-symbols-outlined text-3xl ' + rarityClass;
    document.getElementById('detail-name').textContent = name;
    var rarityEl = document.getElementById('detail-rarity');
    rarityEl.textContent = rarity;
    rarityEl.className = 'text-[10px] font-bold tracking-widest uppercase ' + rarityClass;
    document.getElementById('detail-desc').textContent = desc;

    var tradeoffSection = document.getElementById('detail-tradeoff-section');
    if (tradeoff) {
      tradeoffSection.classList.remove('hidden');
      document.getElementById('detail-tradeoff').textContent = tradeoff;
    } else {
      tradeoffSection.classList.add('hidden');
    }

    var actions = document.getElementById('detail-actions');
    if (owned) {
      if (equipped) {
        actions.innerHTML = '<button onclick="sendAction(\'unequip-relic\',{relic:\'' + id + '\'})" ' +
          'class="w-full py-3 bg-error/10 border border-error/30 text-error text-xs font-bold tracking-widest uppercase hover:bg-error/20 transition-colors">' +
          'UNEQUIP</button>';
      } else {
        actions.innerHTML = '<button onclick="sendAction(\'equip-relic\',{relic:\'' + id + '\'})" ' +
          'class="w-full py-3 bg-tertiary-fixed-dim/10 border border-tertiary-fixed-dim/30 text-tertiary-fixed-dim text-xs font-bold tracking-widest uppercase hover:bg-tertiary-fixed-dim/20 transition-colors">' +
          'EQUIP</button>';
      }
    } else {
      actions.innerHTML = '<div class="text-center py-3 text-secondary/30 text-xs tracking-widest uppercase">LOCKED</div>';
    }

    // Highlight in grid
    document.querySelectorAll('.relic-card').forEach(function(c) { c.classList.remove('selected'); });
    var gridCard = document.getElementById('relic-' + id);
    if (gridCard) gridCard.classList.add('selected');
  }
};

sendAction('ready');
</script>
</body></html>
