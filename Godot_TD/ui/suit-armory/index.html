<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suits</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --suits-bg: #0b1326; --suits-card: #131b2e; --suits-card-hi: #1b2440; --suits-line: rgba(120,140,160,0.22);
  --suits-text: #dbe2fd; --suits-dim: #9aa4b8; --suits-faint: #67718a; --suits-cyan: #62fae4; --suits-sky: #c3e8fd;
  --suits-red: #ff8a7a; --suits-gold: #ffcf6a;
}
* { box-sizing: border-box; }
body { font-family: 'Space Grotesk', sans-serif; background: var(--suits-bg); margin: 0; overflow: hidden; color: var(--suits-text); height: 100vh; }
.suits-scan { position: fixed; inset: 0; pointer-events: none; opacity: 0.3; z-index: 50;
  background: linear-gradient(to bottom, rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px; }
.suits-dots { position: fixed; inset: 0; pointer-events: none; opacity: 0.12;
  background-image: radial-gradient(rgba(140,160,180,0.5) 1px, transparent 1px); background-size: 22px 22px; }
header { display: flex; align-items: center; gap: 18px; height: 72px; padding: 0 40px; border-bottom: 1px solid var(--suits-line); background: rgba(11,19,38,0.85); position: relative; z-index: 2; }
.suits-back { background: none; border: 1px solid var(--suits-line); color: var(--suits-dim); font: inherit; font-size: 15px; padding: 8px 14px; cursor: pointer; }
.suits-back:hover { color: var(--suits-sky); border-color: var(--suits-sky); }
.suits-title { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; color: var(--suits-sky); }
.suits-sub { font-size: 15px; color: var(--suits-dim); }
main { position: relative; z-index: 1; padding: 26px 40px 30px; height: calc(100vh - 72px); display: flex; flex-direction: column; gap: 22px; }
.suits-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.suits-step { border: 1px solid var(--suits-line); background: rgba(19,27,46,0.7); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.suits-step b { display: block; font-size: 15px; letter-spacing: 0.08em; color: var(--suits-cyan); margin-bottom: 3px; }
.suits-step span { font-size: 14px; color: var(--suits-dim); line-height: 1.35; }
.suits-step i { font-style: normal; font-size: 22px; font-weight: 900; color: var(--suits-faint); width: 22px; }
.suits-slots { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.suits-card { border: 1px solid var(--suits-line); background: var(--suits-card); display: flex; flex-direction: column; min-height: 0; position: relative; }
.suits-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--role, #67718a); }
.suits-card.empty { border-style: dashed; background: rgba(19,27,46,0.5); align-items: center; justify-content: center; text-align: center; padding: 30px; }
.suits-card.empty::before, .suits-card.lost::before { display: none; }
.suits-card.lost { border-color: rgba(255,138,122,0.35); opacity: 0.8; }
.suits-head { padding: 18px 20px 12px 24px; border-bottom: 1px solid var(--suits-line); }
.suits-name { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.suits-role { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; padding: 3px 8px; border: 1px solid var(--role); color: var(--role); }
.suits-origin { margin-top: 5px; font-size: 14px; color: var(--suits-dim); }
.suits-towers { list-style: none; margin: 0; padding: 10px 20px 10px 24px; overflow-y: auto; flex: 1; }
.suits-towers li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(120,140,160,0.1); }
.suits-dot { width: 10px; height: 10px; border-radius: 50%; }
.suits-tname { font-size: 16px; }
.suits-tbranch { font-size: 13px; color: var(--suits-gold); margin-left: 8px; }
.suits-pips { display: flex; gap: 3px; }
.suits-pip { width: 9px; height: 9px; border: 1px solid var(--suits-cyan); }
.suits-pip.on { background: var(--suits-cyan); }
.suits-foot { padding: 12px 20px 16px 24px; border-top: 1px solid var(--suits-line); display: flex; flex-direction: column; gap: 10px; }
.suits-value { font-size: 14px; color: var(--suits-dim); }
.suits-value b { color: var(--suits-text); }
.suits-btns { display: flex; gap: 8px; }
.suits-btn { font: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; padding: 10px 14px; cursor: pointer; border: 1px solid var(--suits-line); background: none; color: var(--suits-dim); }
.suits-btn:hover:not(:disabled) { color: var(--suits-text); border-color: var(--suits-sky); }
.suits-btn.go { flex: 1; background: var(--suits-sky); color: #0c3445; border-color: var(--suits-sky); }
.suits-btn.go:hover:not(:disabled) { filter: brightness(1.1); color: #0c3445; }
.suits-btn:disabled { opacity: 0.45; cursor: default; }
.suits-btn.go:disabled { background: none; color: var(--suits-dim); border-color: var(--suits-line); }
.suits-btn.warn { color: var(--suits-red); border-color: rgba(255,138,122,0.4); }
.suits-rename { display: none; gap: 8px; }
.suits-rename.on { display: flex; }
.suits-rename input { flex: 1; font: inherit; font-size: 15px; padding: 8px 10px; background: #060d20; color: var(--suits-text); border: 1px solid var(--suits-sky); outline: none; }
.suits-empty-title { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: var(--suits-faint); margin-bottom: 8px; }
.suits-empty-text { font-size: 15px; color: var(--suits-dim); max-width: 280px; line-height: 1.4; }
.suits-lost { flex: 1; padding: 18px 24px; font-size: 15px; color: var(--suits-red); line-height: 1.4; }
.suits-note { font-size: 14px; color: var(--suits-dim); }
</style>
</head>
<body>
<div class="suits-scan"></div>
<div class="suits-dots"></div>
<header>
  <button class="suits-back" onclick="suitsUI_send('back')">&larr; Back</button>
  <div>
    <div class="suits-title">SUITS</div>
    <div class="suits-sub">Kits of your best towers, for boss fights</div>
  </div>
</header>
<main>
  <section class="suits-steps">
    <div class="suits-step"><i>1</i><div><b>SAVE</b><span>At the end of a run, keep your 8 best towers, at their levels and branches.</span></div></div>
    <div class="suits-step"><i>2</i><div><b>TAKE</b><span>In a boss fight its towers are on the build bar marked KIT, free to place anywhere.</span></div></div>
    <div class="suits-step"><i>3</i><div><b>RISK</b><span>Lose the fight and the suit is lost. Win and you keep it.</span></div></div>
  </section>
  <section id="suits-slots" class="suits-slots"></section>
  <div id="suits-note" class="suits-note"></div>
</main>
<script>
var suitsUI_state = { suits: [], max: 3, boss: { open: false, note: '' }, armed: -1, renaming: -1 };

function suitsUI_send(action, data) {
  if (window.sendIpcData) window.sendIpcData({ action: action, data: data || {} });
}

function suitsUI_esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function suitsUI_card(suit, i) {
  var boss = suitsUI_state.boss;
  if (!suit || suit.empty) {
    return '<div class="suits-card empty"><div class="suits-empty-title">SLOT ' + (i + 1) + ': EMPTY</div>' +
      '<div class="suits-empty-text">Finish a run and save its best towers at the debrief.</div></div>';
  }
  var head = '<div class="suits-head"><div class="suits-name">' + suitsUI_esc(suit.name) +
    '<span class="suits-role">' + suitsUI_esc((suit.role || '').toUpperCase()) + '</span></div>' +
    '<div class="suits-origin">From ' + suitsUI_esc(suit.origin) + '</div></div>';
  if (suit.consumed) {
    return '<div class="suits-card lost" style="--role:' + suit.roleColor + '">' + head +
      '<div class="suits-lost">Lost in a boss fight. Save a new suit here at the end of a run.</div>' +
      '<div class="suits-foot"><div class="suits-btns"><button class="suits-btn" onclick="suitsUI_salvage(' + i + ')">' +
      (suitsUI_state.armed === i ? 'Click again to clear' : 'Clear slot') + '</button></div></div></div>';
  }
  var rows = (suit.towers || []).map(function (t) {
    var pips = '';
    for (var p = 1; p <= t.maxLevel; p++) pips += '<span class="suits-pip' + (p <= t.level ? ' on' : '') + '"></span>';
    return '<li><span class="suits-dot" style="background:' + t.color + '"></span>' +
      '<span><span class="suits-tname">' + suitsUI_esc(t.name) + '</span>' +
      (t.branch ? '<span class="suits-tbranch">' + suitsUI_esc(t.branch) + '</span>' : '') + '</span>' +
      '<span class="suits-pips" title="Level ' + t.level + ' of ' + t.maxLevel + '">' + pips + '</span></li>';
  }).join('');
  var go = boss.open
    ? '<button class="suits-btn go" onclick="suitsUI_send(\'deploy\', {index:' + i + '})">TAKE INTO ' + suitsUI_esc(boss.name.toUpperCase()) + '</button>'
    : '<button class="suits-btn go" disabled title="' + suitsUI_esc(boss.note) + '">NO BOSS FIGHT OPEN</button>';
  var renaming = suitsUI_state.renaming === i;
  return '<div class="suits-card" style="--role:' + suit.roleColor + '">' + head +
    '<ul class="suits-towers">' + rows + '</ul>' +
    '<div class="suits-foot">' +
      '<div class="suits-value"><b>' + suit.count + ' towers</b>, worth ' + suit.value + ' Resources to build</div>' +
      '<div class="suits-rename' + (renaming ? ' on' : '') + '"><input id="suits-name-' + i + '" maxlength="28" value="' + suitsUI_esc(suit.name) + '"/>' +
        '<button class="suits-btn" onclick="suitsUI_rename(' + i + ')">Save</button></div>' +
      '<div class="suits-btns">' + go +
        '<button class="suits-btn" onclick="suitsUI_startRename(' + i + ')">Rename</button>' +
        '<button class="suits-btn warn" onclick="suitsUI_salvage(' + i + ')">' + (suitsUI_state.armed === i ? 'Sure?' : 'Salvage') + '</button>' +
      '</div>' +
    '</div></div>';
}

function suitsUI_render() {
  var html = '';
  for (var i = 0; i < suitsUI_state.max; i++) html += suitsUI_card(suitsUI_state.suits[i], i);
  document.getElementById('suits-slots').innerHTML = html;
  document.getElementById('suits-note').textContent = suitsUI_state.boss.open
    ? 'The next boss fight: ' + suitsUI_state.boss.name + ' (the boss comes at wave ' + suitsUI_state.boss.wave + ').'
    : suitsUI_state.boss.note;
  if (suitsUI_state.renaming >= 0) {
    var input = document.getElementById('suits-name-' + suitsUI_state.renaming);
    if (input) { input.focus(); input.select(); }
  }
}

function suitsUI_startRename(i) { suitsUI_state.renaming = i; suitsUI_state.armed = -1; suitsUI_render(); }

function suitsUI_rename(i) {
  var input = document.getElementById('suits-name-' + i);
  var name = input ? input.value.trim() : '';
  suitsUI_state.renaming = -1;
  if (name) suitsUI_send('rename', { index: i, name: name });
  suitsUI_render();
}

function suitsUI_salvage(i) {
  if (suitsUI_state.armed !== i) { suitsUI_state.armed = i; suitsUI_render(); return; }
  suitsUI_state.armed = -1;
  suitsUI_send('salvage', { index: i });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && suitsUI_state.renaming >= 0) { suitsUI_rename(suitsUI_state.renaming); e.preventDefault(); }
  else if (e.key === 'Escape') {
    if (suitsUI_state.renaming >= 0 || suitsUI_state.armed >= 0) { suitsUI_state.renaming = -1; suitsUI_state.armed = -1; suitsUI_render(); }
    else suitsUI_send('back');
  }
});

window.__suitArmoryUI = {
  setSuits: function (suits, maxSlots, boss) {
    suitsUI_state.suits = suits || [];
    suitsUI_state.max = maxSlots || 3;
    suitsUI_state.boss = boss || { open: false, note: '' };
    suitsUI_render();
  }
};
suitsUI_render();
</script>
</body>
</html>
